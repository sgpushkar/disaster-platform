services:
  - type: web
    name: disaster-intel-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: OPENWEATHER_API_KEY
        value: d85c3616134a7ca3222ac4c92e08c3bd
      - key: OPENWEATHER_DEFAULT_LAT
        value: "19.0760"
      - key: OPENWEATHER_DEFAULT_LON
        value: "72.8777"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: disaster-intel-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: "http://localhost:5173"

databases:
  - name: disaster-intel-db
    plan: free
