services:
  # Backend FastAPI Web Service
  - type: web
    name: disaster-intel-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: OPENWEATHER_API_KEY
        value: d85c3616134a7ca3222ac4c92e08c3bd
      - key: OPENWEATHER_DEFAULT_LAT
        value: "19.0760"
      - key: OPENWEATHER_DEFAULT_LON
        value: "72.8777"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "43200"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: "http://localhost:5173,https://disaster-intel-frontend.onrender.com"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SMS_ENABLED
        value: "true"

  # Frontend React / Vite Static Site (for Render Blueprint deployment)
  - type: web
    name: disaster-intel-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://disaster-platform-6tom.onrender.com"
